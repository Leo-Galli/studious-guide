<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template Sketchfab — Metaverso a Scuola</title>
    <link rel="stylesheet" href="/assets/xr-hud.css" />
  </head>
  <body>
    <a id="backButton" href="index.html">Torna alle demo</a>

    <div id="panel">
      <div class="panel-inner">
        <div class="ph">
          <div>
            <div class="ph-title">Template Sketchfab</div>
            <div class="ph-sub">Modello 3D professionale in scena WebXR</div>
          </div>
        </div>

        <div class="sec-label">Controlli</div>
        <div class="info-vr">
          Desktop: WASD/frecce per muoverti, QE su/giu, R reset vista.<br />
          VR: stick sinistro muove, stick destro ruota e sale/scende.<br />
          Grilletto: punta una sfera luminosa per accenderla.
        </div>

        <div class="credit" id="creditBox"></div>
      </div>
    </div>

    <script type="module">
      import { createXrShell, creditLine } from '/assets/xr-kit.js'
      import { GLTFLoader } from '/vendor/three/examples/jsm/loaders/GLTFLoader.js'

      const { THREE, scene, controllers, startLoop, hideHudInVr } = createXrShell({ withFloor: true })

      document.getElementById('creditBox').textContent = creditLine('WebXR Sketchfab Template')

      const orbColors = [0xc8f542, 0x7ec8ff, 0x9dffa0, 0xe2a38a]
      const orbs = []
      for (let i = 0; i < 12; i++) {
        const r = 0.08 + Math.random() * 0.18
        const baseColor = orbColors[i % orbColors.length]
        const orb = new THREE.Mesh(
          new THREE.SphereGeometry(r, 20, 16),
          new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.15, metalness: 0.7, emissive: baseColor, emissiveIntensity: 0.25 })
        )
        orb.position.set((Math.random() - 0.5) * 14, 1 + Math.random() * 3, (Math.random() - 0.5) * 14)
        orb.userData.floatOffset = Math.random() * Math.PI * 2
        orb.userData.floatSpeed = 0.3 + Math.random() * 0.5
        orb.userData.baseColor = baseColor
        orb.userData.hovered = false
        scene.add(orb)
        orbs.push(orb)
      }

      const rayHover = new THREE.Raycaster()
      const tempMatrix = new THREE.Matrix4()
      const lightColor = new THREE.Color()

      const checkOrbHover = () => {
        const hitOrbs = new Set()
        controllers.forEach((ctrl) => {
          tempMatrix.identity().extractRotation(ctrl.matrixWorld)
          rayHover.ray.origin.setFromMatrixPosition(ctrl.matrixWorld)
          rayHover.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix)
          const hits = rayHover.intersectObjects(orbs, false)
          if (hits.length > 0) hitOrbs.add(hits[0].object)
        })
        orbs.forEach((orb) => {
          const nowHovered = hitOrbs.has(orb)
          if (nowHovered === orb.userData.hovered) return
          orb.userData.hovered = nowHovered
          const mat = orb.material
          if (nowHovered) {
            lightColor.set(orb.userData.baseColor).lerp(new THREE.Color(0xffffff), 0.45)
            mat.color.copy(lightColor)
            mat.emissive.copy(lightColor)
            mat.emissiveIntensity = 0.9
          } else {
            mat.color.set(orb.userData.baseColor)
            mat.emissive.set(orb.userData.baseColor)
            mat.emissiveIntensity = 0.25
          }
        })
      }

      const loader = new GLTFLoader()
      const gltf = await loader.loadAsync('sketchfab-models/2024-ducati-streetfighter-v4-s-c501252f8af64c559bf91dc306c3a550/scene.gltf')
      scene.add(gltf.scene)

      hideHudInVr([document.getElementById('panel'), document.getElementById('backButton')])

      const clock = new THREE.Clock()
      startLoop(() => {
        const t = clock.getElapsedTime()
        orbs.forEach((orb) => {
          orb.position.y += Math.sin(t * orb.userData.floatSpeed + orb.userData.floatOffset) * 0.003
        })
        checkOrbHover()
      })
    </script>
  </body>
</html>
